spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/aparna_jewels}
    username: ${POSTGRES_USER:aj_repo}
    password: ${POSTGRES_PASSWORD}

    hikari:
      pool-name: aparna-local-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      client-name: "${REDIS_CLIENT_NAME:aparna-jewels-local}"
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          '[time_zone]': UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    baseline-on-migrate: false
  
  config:
    import: "file:./.env[.properties]"
  app:
    security:
      cookie:
        name: AJ_SESSION
        secure: false
        same-site: Lax