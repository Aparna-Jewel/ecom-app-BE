spring:
  application:
    name: ecommerce-foundation
  
  session:
      redis:
        repository-type: indexed

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  name: Ecommerce Foundation
  version: 0.0.1
  environment: ${spring.profiles.active}
  security:
    otp:
      validity: 5m
      resend-delay: 60s
      max-failed-attempts: 5
      cooloff-period: 30m
      max-verification-attempt: 3
      code-lengths:
        customer-signup: 6
        admin-login: 8
        ops-login: 8

      ip-limit:
        max-requests: 20
        window: 1m

      hmac:
        key-id: ${OTP_HMAC_KEY_ID:v1}
        key-base64: ${OTP_HMAC_KEY_BASE64}
    jwt:
      otp-proof:
        issuer: ${JWT_OTP_PROOF_ISSUER:aparna-jewels}
        audience: ${JWT_OTP_PROOF_AUDIENCE:aparna-jewels-registration}
        ttl: ${JWT_OTP_PROOF_TTL:5m}
        clock-skew: ${JWT_OTP_PROOF_CLOCK_SKEW:30s}

        kid: ${JWT_OTP_PROOF_KID:local-2026-01}

        private-key: ${JWT_OTP_PROOF_PRIVATE_KEY_LOCATION}
        public-key: ${JWT_OTP_PROOF_PUBLIC_KEY_LOCATION}
      customer:
        idle-timeout: 7d
        absolute-timeout: 30d
        refresh-interval: 6h
      staff:
        idle-timeout: 1h
        absolute-timeout: 24h
        refresh-interval: 15m
  redis:
    key:
      namespace: aj
      environment: ${APP_ENV:${spring.profiles.active}}
      
